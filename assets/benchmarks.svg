<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%" height="100%">
  <rect width="1200" height="185" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Panel: Sharded Cache Multi-Core Contention Benchmark -->
  <text x="32" y="34" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1">
    BENCHMARK 01 // C++17 SHARDED CONCURRENT LRU CACHE (HIGH MULTI-CORE CONTENTION)
  </text>

  <text x="32" y="68" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">SplitMix64 Sharded + Splice</text>
  <rect x="260" y="53" width="280" height="20" rx="3" fill="#10B981"/>
  <text x="550" y="68" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">20.3 Mops/s (5.48x vs Global Lock)</text>

  <text x="32" y="104" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Single-Thread Baseline</text>
  <rect x="260" y="89" width="101" height="20" rx="3" fill="#38BDF8"/>
  <text x="371" y="104" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">7.3 Mops/s</text>

  <text x="32" y="140" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Global std::mutex Contended</text>
  <rect x="260" y="125" width="51" height="20" rx="3" fill="#475569"/>
  <text x="321" y="140" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">3.7 Mops/s (Lock Collapse)</text>

  <text x="32" y="168" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    Verified across 400,000 randomized differential operations · 0 races / 0 leaks under TSan, ASan &amp; UBSan
  </text>

  <!-- Vertical Divider -->
  <line x1="835" y1="20" x2="835" y2="165" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Right Panel: WASM Wide Arithmetic & Lowering -->
  <text x="862" y="34" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1">
    BENCHMARK 02 // WASM 128-BIT LOWERING
  </text>
  <text x="862" y="66" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
    i64.add128 · i64.sub128 · i64.mul_wide
  </text>
  <text x="862" y="94" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    • Hardware carry-chain lowering (adc / sbb)
  </text>
  <text x="862" y="116" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    • LLVM ORC JIT proofs (SysV &amp; Win64 ABIs)
  </text>
  <text x="862" y="138" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    • 200,000 randomized differential vectors
  </text>
  <text x="862" y="164" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
    2,316 Python / Wasmtime Checks · 0 Mismatches
  </text>
</svg>
